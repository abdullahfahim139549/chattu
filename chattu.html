    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Animated Stars Background */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite, moveStars 20s linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes moveStars {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(100vh) translateX(50px); }
        }

        /* Glass Morphism Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b8b8d1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .google-btn {
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #666;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .link-text {
            text-align: center;
            margin-top: 20px;
            color: #b8b8d1;
            font-size: 14px;
        }

        .link-text a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .link-text a:hover {
            color: #764ba2;
        }

        /* Chat Interface */
        .chat-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            padding: 8px 20px;
            font-size: 14px;
            width: auto;
            margin: 0;
        }

        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .contacts-sidebar {
            width: 300px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .add-contact-section {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .add-contact-section input {
            margin-bottom: 10px;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .contact-item.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }

        .messages-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.5);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            animation: messageSlide 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .message img {
            /* CHANGE Make images responsive with max dimensions instead of full width */
            max-width: 250px;
            max-height: 300px;
            width: auto;
            height: auto;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
        }

        .message img:hover {
            transform: scale(1.02);
        }

        /* CHANGE Add image modal for full-screen preview on click */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.3);
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .image-modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .message-input-area {
            padding: 20px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input-area input {
            flex: 1;
            margin: 0;
        }

        .image-upload-btn,
        .send-btn {
            padding: 14px 20px;
            width: auto;
            margin: 0;
            flex-shrink: 0;
        }

        .image-upload-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            /* CHANGE Adjust image size for mobile devices */
            .message img {
                max-width: 200px;
                max-height: 250px;
            }

            .message {
                max-width: 85%;
            }

            .contacts-sidebar {
                width: 100%;
                position: absolute;
                left: -100%;
                transition: left 0.3s ease;
                z-index: 10;
            }

            .contacts-sidebar.show {
                left: 0;
            }

            .glass-card {
                padding: 30px 20px;
            }
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-chat-selected {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 18px;
        }
        
        /* Added profile picture styles */
        .profile-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(102, 126, 234, 0.5);
        }

        .profile-pic-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(102, 126, 234, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-pic-large:hover {
            transform: scale(1.05);
        }

        .default-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .default-avatar-large {
            width: 80px;
            height: 80px;
            font-size: 32px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .contact-mobile {
            font-size: 12px;
            color: #888;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Notification permission banner */
        .notification-banner {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-banner button {
            width: auto;
            padding: 8px 16px;
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Animated Stars Background -->
    <div id="stars-container"></div>

    <!-- Auth Container -->
    <div class="container" id="auth-container">
        <div class="glass-card">
            <div class="logo">
                <img src="https://i.ibb.co.com/dwH8yJPH/Chattu.png" alt="Chattu Logo">
                <h1>Chattu</h1>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>
                <button onclick="emailLogin()">Login</button>
                <div class="divider">OR</div>
                <button class="google-btn" onclick="googleLogin()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Continue with Google
                </button>
                <div class="link-text">
                    Don't have an account? <a onclick="showSignup()">Sign Up</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password">
                </div>
                <button onclick="emailSignup()">Sign Up</button>
                <div class="divider">OR</div>
                <button class="google-btn" onclick="googleLogin()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Continue with Google
                </button>
                <div class="link-text">
                    Already have an account? <a onclick="showLogin()">Login</a>
                </div>
            </div>

            <!-- Registration Form (for new users) -->
            <div id="registration-form" class="hidden">
                <h3 style="margin-bottom: 20px; text-align: center;">Complete Your Profile</h3>
                <!-- Added profile picture upload -->
                <div class="profile-upload-section">
                    <div id="preview-avatar" class="default-avatar default-avatar-large">?</div>
                    <input type="file" id="profile-pic-input" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('profile-pic-input').click()" style="margin-top: 10px; width: auto; padding: 8px 20px;">Upload Photo</button>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Mobile Number (Bangladeshi - 11 digits)</label>
                    <input type="tel" id="reg-mobile" placeholder="01XXXXXXXXX" maxlength="11" pattern="[0-9]{11}">
                </div>
                <button onclick="completeRegistration()">Complete Registration</button>
            </div>
        </div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <!-- Added profile info in header -->
            <div class="chat-header-info">
                <div id="current-user-avatar"></div>
                <h2>💬 Chattu</h2>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="chat-main">
            <div class="contacts-sidebar">
                <!-- Added notification banner -->
                <div id="notification-banner" class="notification-banner hidden">
                    <span>Enable notifications to stay updated</span>
                    <button onclick="requestNotificationPermission()">Enable</button>
                </div>
                <div class="add-contact-section">
                    <h3 style="margin-bottom: 15px;">Add Friend</h3>
                    <input type="tel" id="friend-mobile" placeholder="Enter mobile number" maxlength="11">
                    <button onclick="addContact()">Add Contact</button>
                </div>
                <div class="contacts-list" id="contacts-list">
                    <!-- Contacts will be dynamically added here -->
                </div>
            </div>
            <div class="messages-area">
                <div id="no-chat" class="no-chat-selected">
                    Select a contact to start chatting
                </div>
                <div id="messages-view" class="hidden" style="flex: 1; display: flex; flex-direction: column;">
                    <!-- Added chat partner info header -->
                    <div id="chat-partner-header" style="padding: 15px; background: rgba(20, 20, 35, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 12px;">
                        <div id="chat-partner-avatar"></div>
                        <div>
                            <div id="chat-partner-name" style="font-weight: 600;"></div>
                            <div id="chat-partner-mobile" style="font-size: 12px; color: #888;"></div>
                        </div>
                    </div>
                    <div class="messages-container" id="messages-container">
                        <!-- Messages will appear here -->
                    </div>
                    <div class="message-input-area">
                        <input type="file" id="image-input" accept="image/*" class="hidden">
                        <button class="image-upload-btn" onclick="document.getElementById('image-input').click()">📷</button>
                        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="send-btn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="hidden">
        <!-- CHANGE Add image modal for full-screen preview -->
        <div id="image-modal" class="image-modal">
            <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
            <img id="modal-image" src="/placeholder.svg" alt="Full size image">
        </div>

        <div class="contacts-sidebar" id="contacts-sidebar">
            <!-- Notification permission banner -->
            <div id="notification-banner" class="notification-banner hidden">
                <span>Enable notifications to stay updated</span>
                <button onclick="requestNotificationPermission()">Enable</button>
            </div>
            <div class="add-contact-section">
                <h3 style="margin-bottom: 15px;">Add Friend</h3>
                <input type="tel" id="friend-mobile" placeholder="Enter mobile number" maxlength="11">
                <button onclick="addContact()">Add Contact</button>
            </div>
            <div class="contacts-list" id="contacts-list">
                <!-- Contacts will be dynamically added here -->
            </div>
        </div>
        <div class="messages-area">
            <div id="no-chat" class="no-chat-selected">
                Select a contact to start chatting
            </div>
            <div id="messages-view" class="hidden" style="flex: 1; display: flex; flex-direction: column;">
                <div id="chat-partner-header" style="padding: 15px; background: rgba(20, 20, 35, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 12px;">
                    <div id="chat-partner-avatar"></div>
                    <div>
                        <div id="chat-partner-name" style="font-weight: 600;"></div>
                        <div id="chat-partner-mobile" style="font-size: 12px; color: #888;"></div>
                    </div>
                </div>
                <div class="messages-container" id="messages-container">
                    <!-- Messages will appear here -->
                </div>
                <div class="message-input-area">
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                    <button class="image-upload-btn" onclick="document.getElementById('image-input').click()">📷</button>
                    <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, query, orderBy, onSnapshot, where, serverTimestamp, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCyswy_RDGq-tBmZXaLI9kDvwS5YJoYrDA",
            authDomain: "chattu-da27c.firebaseapp.com",
            projectId: "chattu-da27c",
            storageBucket: "chattu-da27c.firebasestorage.app",
            messagingSenderId: "976231417730",
            appId: "1:976231417730:web:295bebeef085a3c787b19b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const IMGBB_API_KEY = '3aa0cf0837f3ea6c49d67351d09d80a5';

        window.auth = auth;
        window.db = db;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithPopup = signInWithPopup;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.query = query;
        window.orderBy = orderBy;
        window.onSnapshot = onSnapshot;
        window.where = where;
        window.serverTimestamp = serverTimestamp;
        window.limit = limit;
        window.IMGBB_API_KEY = IMGBB_API_KEY;

        let currentUser = null;
        let currentChatUser = null;
        let messagesUnsubscribe = null;
        let messageListeners = new Map();
        let profilePicUrl = null;

        // Create animated stars
        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 15 + 15) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                    });

                    self.addEventListener('activate', (event) => {
                        event.waitUntil(self.clients.claim());
                    });

                    self.addEventListener('notificationclick', (event) => {
                        event.notification.close();
                        event.waitUntil(
                            clients.openWindow('/')
                        );
                    });
                `;
                
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('[v0] Service Worker registered'))
                    .catch(err => console.log('[v0] Service Worker registration failed:', err));
            });
        }

        window.requestNotificationPermission = async () => {
            if (!('Notification' in window)) {
                alert('This browser does not support notifications');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                document.getElementById('notification-banner').classList.add('hidden');
                showNotification('Notifications Enabled', 'You will now receive message notifications');
            }
        };

        function showNotification(title, body, icon = 'https://i.ibb.co.com/dwH8yJPH/Chattu.png') {
            if (Notification.permission === 'granted') {
                navigator.serviceWorker.ready.then(registration => {
                    registration.showNotification(title, {
                        body: body,
                        icon: icon,
                        badge: icon,
                        vibrate: [200, 100, 200],
                        tag: 'chattu-message'
                    });
                });
            }
        }

        document.getElementById('profile-pic-input')?.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('Image size must be less than 5MB');
                return;
            }

            try {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const previewAvatar = document.getElementById('preview-avatar');
                    previewAvatar.innerHTML = `<img src="${event.target.result}" class="profile-pic-large" style="width: 100%; height: 100%; border-radius: 50%;">`;
                };
                reader.readAsDataURL(file);

                profilePicUrl = await uploadImageToImgBB(file);
            } catch (error) {
                alert('Failed to upload profile picture: ' + error.message);
            }
        });

        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (!userDoc.exists()) {
                    document.getElementById('auth-container').style.display = 'flex';
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('signup-form').classList.add('hidden');
                    document.getElementById('registration-form').classList.remove('hidden');
                } else {
                    currentUser = { uid: user.uid, ...userDoc.data() };
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('chat-container').style.display = 'flex';
                    
                    displayUserAvatar();
                    
                    loadContacts();
                    setupNotificationListeners();
                    
                    if (Notification.permission === 'default') {
                        document.getElementById('notification-banner').classList.remove('hidden');
                    }
                }
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('chat-container').style.display = 'none';
            }
        });

        function displayUserAvatar() {
            const avatarContainer = document.getElementById('current-user-avatar');
            if (currentUser.profilePicUrl) {
                avatarContainer.innerHTML = `<img src="${currentUser.profilePicUrl}" class="profile-pic" alt="${currentUser.name}">`;
            } else {
                const initial = currentUser.name.charAt(0).toUpperCase();
                avatarContainer.innerHTML = `<div class="default-avatar">${initial}</div>`;
            }
        }

        async function setupNotificationListeners() {
            const contactsRef = collection(db, 'users', currentUser.uid, 'contacts');
            const contactsSnapshot = await getDocs(contactsRef);
            
            contactsSnapshot.forEach(contactDoc => {
                const contactId = contactDoc.id;
                const chatId = [currentUser.uid, contactId].sort().join('_');
                
                // Listen to new messages from this contact
                const messagesRef = collection(db, 'chats', chatId, 'messages');
                const q = query(messagesRef, orderBy('timestamp', 'desc'), limit(1));
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const message = change.doc.data();
                            // Only notify if message is from contact and user is not viewing this chat
                            if (message.senderId === contactId && 
                                (!currentChatUser || currentChatUser.id !== contactId) &&
                                !document.hidden) {
                                
                                const contactData = contactDoc.data();
                                const notificationBody = message.text || '📷 Image';
                                showNotification(
                                    `New message from ${contactData.name}`,
                                    notificationBody,
                                    contactData.profilePicUrl
                                );
                            }
                        }
                    });
                });
                
                messageListeners.set(contactId, unsubscribe);
            });
        }

        // Show Signup Form
        window.showSignup = () => {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
        };

        // Show Login Form
        window.showLogin = () => {
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        };

        // Email Login
        window.emailLogin = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        };

        // Email Signup
        window.emailSignup = async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Signup failed: ' + error.message);
            }
        };

        // Google Login
        window.googleLogin = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('Google login failed: ' + error.message);
            }
        };

        // Complete Registration
        window.completeRegistration = async () => {
            const name = document.getElementById('reg-name').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();

            if (!name || !mobile) {
                alert('Please fill in all fields');
                return;
            }

            if (!/^01[0-9]{9}$/.test(mobile)) {
                alert('Please enter a valid Bangladeshi mobile number (11 digits starting with 01)');
                return;
            }

            try {
                const mobileQuery = query(collection(db, 'users'), where('mobileNumber', '==', mobile));
                const mobileSnapshot = await getDocs(mobileQuery);
                
                if (!mobileSnapshot.empty) {
                    alert('This mobile number is already registered');
                    return;
                }

                const userData = {
                    name: name,
                    email: auth.currentUser.email,
                    mobileNumber: mobile,
                    createdAt: serverTimestamp()
                };

                if (profilePicUrl) {
                    userData.profilePicUrl = profilePicUrl;
                }

                await setDoc(doc(db, 'users', auth.currentUser.uid), userData);

                alert('Registration completed successfully!');
                location.reload();
            } catch (error) {
                alert('Registration failed: ' + error.message);
            }
        };

        // Logout
        window.logout = async () => {
            if (messagesUnsubscribe) {
                messagesUnsubscribe();
            }
            messageListeners.forEach(unsubscribe => unsubscribe());
            messageListeners.clear();
            
            await signOut(auth);
            location.reload();
        };

        // Add Contact
        window.addContact = async () => {
            const mobile = document.getElementById('friend-mobile').value.trim();
            
            if (!mobile) {
                alert('Please enter a mobile number');
                return;
            }

            if (!/^01[0-9]{9}$/.test(mobile)) {
                alert('Please enter a valid Bangladeshi mobile number');
                return;
            }

            if (mobile === currentUser.mobileNumber) {
                alert('You cannot add yourself as a contact');
                return;
            }

            try {
                const usersQuery = query(collection(db, 'users'), where('mobileNumber', '==', mobile));
                const userSnapshot = await getDocs(usersQuery);

                if (userSnapshot.empty) {
                    alert('No user found with this mobile number');
                    return;
                }

                const contactUser = userSnapshot.docs[0];
                const contactData = { id: contactUser.id, ...contactUser.data() };

                // Check if contact already exists
                const contactsRef = collection(db, 'users', currentUser.uid, 'contacts');
                const existingContact = await getDoc(doc(contactsRef, contactUser.id));

                if (existingContact.exists()) {
                    alert('Contact already exists');
                    return;
                }

                const contactInfo = {
                    name: contactData.name,
                    mobileNumber: contactData.mobileNumber,
                    addedAt: serverTimestamp()
                };

                if (contactData.profilePicUrl) {
                    contactInfo.profilePicUrl = contactData.profilePicUrl;
                }

                await setDoc(doc(contactsRef, contactUser.id), contactInfo);

                document.getElementById('friend-mobile').value = '';
                alert('Contact added successfully!');
                loadContacts();
                setupNotificationListeners();
            } catch (error) {
                alert('Failed to add contact: ' + error.message);
            }
        };

        // Load Contacts
        async function loadContacts() {
            const contactsList = document.getElementById('contacts-list');
            contactsList.innerHTML = '';

            try {
                const contactsRef = collection(db, 'users', currentUser.uid, 'contacts');
                const contactsSnapshot = await getDocs(contactsRef);

                if (contactsSnapshot.empty) {
                    contactsList.innerHTML = '<p style="padding: 20px; text-align: center; color: #666;">No contacts yet</p>';
                    return;
                }

                contactsSnapshot.forEach(contactDoc => {
                    const contact = contactDoc.data();
                    const contactId = contactDoc.id;
                    
                    const contactDiv = document.createElement('div');
                    contactDiv.className = 'contact-item';
                    contactDiv.onclick = () => openChat({ id: contactId, ...contact });
                    
                    let avatarHTML;
                    if (contact.profilePicUrl) {
                        avatarHTML = `<img src="${contact.profilePicUrl}" class="profile-pic" alt="${contact.name}">`;
                    } else {
                        const initial = contact.name.charAt(0).toUpperCase();
                        avatarHTML = `<div class="default-avatar">${initial}</div>`;
                    }
                    
                    contactDiv.innerHTML = `
                        ${avatarHTML}
                        <div class="contact-info">
                            <div class="contact-name">${contact.name}</div>
                            <div class="contact-mobile">${contact.mobileNumber}</div>
                        </div>
                    `;
                    
                    contactsList.appendChild(contactDiv);
                });
            } catch (error) {
                alert('Failed to load contacts: ' + error.message);
            }
        }

        // Open Chat
        window.openChat = (contact) => {
            currentChatUser = contact;
            
            document.getElementById('no-chat').style.display = 'none';
            document.getElementById('messages-view').classList.remove('hidden');

            const partnerAvatarContainer = document.getElementById('chat-partner-avatar');
            if (contact.profilePicUrl) {
                partnerAvatarContainer.innerHTML = `<img src="${contact.profilePicUrl}" class="profile-pic" alt="${contact.name}">`;
            } else {
                const initial = contact.name.charAt(0).toUpperCase();
                partnerAvatarContainer.innerHTML = `<div class="default-avatar">${initial}</div>`;
            }
            
            document.getElementById('chat-partner-name').textContent = contact.name;
            document.getElementById('chat-partner-mobile').textContent = contact.mobileNumber;

            // Highlight active contact
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.contact-item')?.classList.add('active');

            loadMessages();
        };

        // Load Messages
        function loadMessages() {
            const messagesContainer = document.getElementById('messages-container');
            messagesContainer.innerHTML = '';

            if (messagesUnsubscribe) {
                messagesUnsubscribe();
            }

            const chatId = [currentUser.uid, currentChatUser.id].sort().join('_');
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            const q = query(messagesRef, orderBy('timestamp', 'asc'));

            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        const message = change.doc.data();
                        displayMessage(message);
                    }
                });

                // Scroll to bottom
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // Display Message
        function displayMessage(message) {
            const messagesContainer = document.getElementById('messages-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.senderId === currentUser.uid ? 'sent' : 'received'}`;

            let content = '';
            if (message.text) {
                content = `<div>${message.text}</div>`;
            }
            if (message.imageUrl) {
                /* CHANGE Add click handler to open image in modal */
                content += `<img src="${message.imageUrl}" alt="Image" onclick="openImageModal('${message.imageUrl}')">`;
            }

            const timestamp = message.timestamp ? new Date(message.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Sending...';
            
            messageDiv.innerHTML = `
                ${content}
                <div class="message-time">${timestamp}</div>
            `;

            messagesContainer.appendChild(messageDiv);
        }

        // Send Message
        window.sendMessage = async () => {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text) return;
            if (!currentChatUser) {
                alert('Please select a contact first');
                return;
            }

            try {
                const chatId = [currentUser.uid, currentChatUser.id].sort().join('_');
                await addDoc(collection(db, 'chats', chatId, 'messages'), {
                    text: text,
                    senderId: currentUser.uid,
                    receiverId: currentChatUser.id,
                    timestamp: serverTimestamp()
                });

                input.value = '';
            } catch (error) {
                alert('Failed to send message: ' + error.message);
            }
        };

        // Upload Image to ImgBB
        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error('Image upload failed');
            }
        }

        // Handle Image Upload
        document.getElementById('image-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!currentChatUser) {
                alert('Please select a contact first');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert('Image size must be less than 5MB');
                return;
            }

            try {
                const imageUrl = await uploadImageToImgBB(file);
                const chatId = [currentUser.uid, currentChatUser.id].sort().join('_');
                
                await addDoc(collection(db, 'chats', chatId, 'messages'), {
                    imageUrl: imageUrl,
                    senderId: currentUser.uid,
                    receiverId: currentChatUser.id,
                    timestamp: serverTimestamp()
                });

                e.target.value = '';
            } catch (error) {
                alert('Failed to send image: ' + error.message);
            }
        });

        // CHANGE Add image modal functions
        window.openImageModal = (imageUrl) => {
            const modal = document.getElementById('image-modal');
            const modalImage = document.getElementById('modal-image');
            modalImage.src = imageUrl;
            modal.classList.add('active');
        };

        window.closeImageModal = () => {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('active');
        };

        // Close modal on background click
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('image-modal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeImageModal();
                    }
                });
            }
        });
    </script>
</body>
</html>
