<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chattu - Modern Chat Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Animated Stars Background */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite, moveStars 20s linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes moveStars {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(100vh) translateX(50px); }
        }

        /* Glass Morphism Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b8b8d1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .google-btn {
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #666;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .link-text {
            text-align: center;
            margin-top: 20px;
            color: #b8b8d1;
            font-size: 14px;
        }

        .link-text a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .link-text a:hover {
            color: #764ba2;
        }

        /* Chat Interface */
        .chat-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            padding: 8px 20px;
            font-size: 14px;
            width: auto;
            margin: 0;
        }

        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .contacts-sidebar {
            width: 300px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .add-contact-section {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .add-contact-section input {
            margin-bottom: 10px;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .contact-item.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }

        .messages-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.5);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            animation: messageSlide 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .message-input-area {
            padding: 20px;
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input-area input {
            flex: 1;
            margin: 0;
        }

        .image-upload-btn,
        .send-btn {
            padding: 14px 20px;
            width: auto;
            margin: 0;
            flex-shrink: 0;
        }

        .image-upload-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contacts-sidebar {
                width: 100%;
                position: absolute;
                left: -100%;
                transition: left 0.3s ease;
                z-index: 10;
            }

            .contacts-sidebar.show {
                left: 0;
            }

            .glass-card {
                padding: 30px 20px;
            }
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-chat-selected {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- Animated Stars Background -->
    <div id="stars-container"></div>

    <!-- Auth Container -->
    <div class="container" id="auth-container">
        <div class="glass-card">
            <div class="logo">
                <img src="https://i.ibb.co.com/dwH8yJPH/Chattu.png" alt="Chattu Logo">
                <h1>Chattu</h1>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>
                <button onclick="emailLogin()">Login</button>
                <div class="divider">OR</div>
                <button class="google-btn" onclick="googleLogin()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Continue with Google
                </button>
                <div class="link-text">
                    Don't have an account? <a onclick="showSignup()">Sign Up</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password">
                </div>
                <button onclick="emailSignup()">Sign Up</button>
                <div class="divider">OR</div>
                <button class="google-btn" onclick="googleLogin()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Continue with Google
                </button>
                <div class="link-text">
                    Already have an account? <a onclick="showLogin()">Login</a>
                </div>
            </div>

            <!-- Registration Form (for new users) -->
            <div id="registration-form" class="hidden">
                <h3 style="margin-bottom: 20px; text-align: center;">Complete Your Profile</h3>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Mobile Number (Bangladeshi - 11 digits)</label>
                    <input type="tel" id="reg-mobile" placeholder="01XXXXXXXXX" maxlength="11" pattern="[0-9]{11}">
                </div>
                <button onclick="completeRegistration()">Complete Registration</button>
            </div>
        </div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <h2>💬 Chattu</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="chat-main">
            <div class="contacts-sidebar">
                <div class="add-contact-section">
                    <h3 style="margin-bottom: 15px;">Add Friend</h3>
                    <input type="tel" id="friend-mobile" placeholder="Enter mobile number" maxlength="11">
                    <button onclick="addContact()">Add Contact</button>
                </div>
                <div class="contacts-list" id="contacts-list">
                    <!-- Contacts will be dynamically added here -->
                </div>
            </div>
            <div class="messages-area">
                <div id="no-chat" class="no-chat-selected">
                    Select a contact to start chatting
                </div>
                <div id="messages-view" class="hidden" style="flex: 1; display: flex; flex-direction: column;">
                    <div class="messages-container" id="messages-container">
                        <!-- Messages will appear here -->
                    </div>
                    <div class="message-input-area">
                        <input type="file" id="image-input" accept="image/*" class="hidden">
                        <button class="image-upload-btn" onclick="document.getElementById('image-input').click()">📷</button>
                        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="send-btn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, query, orderBy, onSnapshot, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCyswy_RDGq-tBmZXaLI9kDvwS5YJoYrDA",
            authDomain: "chattu-da27c.firebaseapp.com",
            projectId: "chattu-da27c",
            storageBucket: "chattu-da27c.firebasestorage.app",
            messagingSenderId: "976231417730",
            appId: "1:976231417730:web:295bebeef085a3c787b19b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const IMGBB_API_KEY = '3aa0cf0837f3ea6c49d67351d09d80a5';

        window.auth = auth;
        window.db = db;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithPopup = signInWithPopup;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.query = query;
        window.orderBy = orderBy;
        window.onSnapshot = onSnapshot;
        window.where = where;
        window.serverTimestamp = serverTimestamp;
        window.IMGBB_API_KEY = IMGBB_API_KEY;

        let currentUser = null;
        let currentChatUser = null;
        let messagesUnsubscribe = null;

        // Create animated stars
        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 15 + 15) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists() && userDoc.data().mobileNumber) {
                    currentUser = { uid: user.uid, ...userDoc.data() };
                    showChatInterface();
                    loadContacts();
                } else {
                    document.getElementById('auth-container').classList.remove('hidden');
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('signup-form').classList.add('hidden');
                    document.getElementById('registration-form').classList.remove('hidden');
                }
            } else {
                currentUser = null;
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('chat-container').style.display = 'none';
            }
        });

        // Show/Hide Forms
        window.showSignup = () => {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('signup-form').classList.remove('hidden');
        };

        window.showLogin = () => {
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        };

        // Email Login
        window.emailLogin = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        };

        // Email Signup
        window.emailSignup = async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Signup failed: ' + error.message);
            }
        };

        // Google Login
        window.googleLogin = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('Google login failed: ' + error.message);
            }
        };

        // Complete Registration
        window.completeRegistration = async () => {
            const name = document.getElementById('reg-name').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();

            if (!name || !mobile) {
                alert('Please fill in all fields');
                return;
            }

            if (!/^01[0-9]{9}$/.test(mobile)) {
                alert('Please enter a valid Bangladeshi mobile number (11 digits starting with 01)');
                return;
            }

            try {
                const mobileQuery = query(collection(db, 'users'), where('mobileNumber', '==', mobile));
                const mobileSnapshot = await getDocs(mobileQuery);
                
                if (!mobileSnapshot.empty) {
                    alert('This mobile number is already registered');
                    return;
                }

                await setDoc(doc(db, 'users', auth.currentUser.uid), {
                    name: name,
                    email: auth.currentUser.email,
                    mobileNumber: mobile,
                    createdAt: serverTimestamp()
                });

                currentUser = {
                    uid: auth.currentUser.uid,
                    name: name,
                    email: auth.currentUser.email,
                    mobileNumber: mobile
                };

                showChatInterface();
                loadContacts();
            } catch (error) {
                alert('Registration failed: ' + error.message);
            }
        };

        // Show Chat Interface
        function showChatInterface() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('chat-container').style.display = 'flex';
        }

        // Logout
        window.logout = async () => {
            if (messagesUnsubscribe) {
                messagesUnsubscribe();
            }
            await signOut(auth);
            location.reload();
        };

        // Add Contact
        window.addContact = async () => {
            const mobile = document.getElementById('friend-mobile').value.trim();
            
            if (!mobile) {
                alert('Please enter a mobile number');
                return;
            }

            if (!/^01[0-9]{9}$/.test(mobile)) {
                alert('Please enter a valid Bangladeshi mobile number');
                return;
            }

            if (mobile === currentUser.mobileNumber) {
                alert('You cannot add yourself as a contact');
                return;
            }

            try {
                const usersQuery = query(collection(db, 'users'), where('mobileNumber', '==', mobile));
                const userSnapshot = await getDocs(usersQuery);

                if (userSnapshot.empty) {
                    alert('No user found with this mobile number');
                    return;
                }

                const contactUser = userSnapshot.docs[0];
                const contactData = { id: contactUser.id, ...contactUser.data() };

                // Check if contact already exists
                const contactsRef = collection(db, 'users', currentUser.uid, 'contacts');
                const existingContact = await getDoc(doc(contactsRef, contactUser.id));

                if (existingContact.exists()) {
                    alert('Contact already exists');
                    return;
                }

                await setDoc(doc(contactsRef, contactUser.id), {
                    name: contactData.name,
                    mobileNumber: contactData.mobileNumber,
                    addedAt: serverTimestamp()
                });

                document.getElementById('friend-mobile').value = '';
                alert('Contact added successfully!');
                loadContacts();
            } catch (error) {
                alert('Failed to add contact: ' + error.message);
            }
        };

        // Load Contacts
        async function loadContacts() {
            const contactsList = document.getElementById('contacts-list');
            contactsList.innerHTML = '';

            try {
                const contactsRef = collection(db, 'users', currentUser.uid, 'contacts');
                const contactsSnapshot = await getDocs(contactsRef);

                if (contactsSnapshot.empty) {
                    contactsList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No contacts yet. Add friends to start chatting!</p>';
                    return;
                }

                contactsSnapshot.forEach((doc) => {
                    const contact = { id: doc.id, ...doc.data() };
                    const contactItem = document.createElement('div');
                    contactItem.className = 'contact-item';
                    contactItem.innerHTML = `
                        <div style="font-weight: 600;">${contact.name}</div>
                        <div style="font-size: 13px; color: #999; margin-top: 5px;">${contact.mobileNumber}</div>
                    `;
                    contactItem.onclick = () => openChat(contact);
                    contactsList.appendChild(contactItem);
                });
            } catch (error) {
                console.error('Failed to load contacts:', error);
            }
        }

        // Open Chat
        function openChat(contact) {
            currentChatUser = contact;
            
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.contact-item').classList.add('active');

            document.getElementById('no-chat').classList.add('hidden');
            document.getElementById('messages-view').classList.remove('hidden');
            
            loadMessages();
        }

        // Load Messages
        function loadMessages() {
            if (messagesUnsubscribe) {
                messagesUnsubscribe();
            }

            const messagesContainer = document.getElementById('messages-container');
            messagesContainer.innerHTML = '';

            const chatId = [currentUser.uid, currentChatUser.id].sort().join('_');
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            const messagesQuery = query(messagesRef, orderBy('timestamp', 'asc'));

            messagesUnsubscribe = onSnapshot(messagesQuery, (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const message = doc.data();
                    addMessageToUI(message);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // Add Message to UI
        function addMessageToUI(message) {
            const messagesContainer = document.getElementById('messages-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.senderId === currentUser.uid ? 'sent' : 'received'}`;
            
            let content = '';
            if (message.text) {
                content += `<div>${message.text}</div>`;
            }
            if (message.imageUrl) {
                content += `<img src="${message.imageUrl}" alt="Image">`;
            }
            
            const time = message.timestamp ? new Date(message.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Now';
            content += `<div class="message-time">${time}</div>`;
            
            messageDiv.innerHTML = content;
            messagesContainer.appendChild(messageDiv);
        }

        // Send Message
        window.sendMessage = async () => {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text) return;
            if (!currentChatUser) {
                alert('Please select a contact first');
                return;
            }

            try {
                const chatId = [currentUser.uid, currentChatUser.id].sort().join('_');
                await addDoc(collection(db, 'chats', chatId, 'messages'), {
                    text: text,
                    senderId: currentUser.uid,
                    receiverId: currentChatUser.id,
                    timestamp: serverTimestamp()
                });

                input.value = '';
            } catch (error) {
                alert('Failed to send message: ' + error.message);
            }
        };

        // Upload Image to ImgBB
        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error('Image upload failed');
            }
        }

        // Handle Image Upload
        document.getElementById('image-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!currentChatUser) {
                alert('Please select a contact first');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert('Image size must be less than 5MB');
                return;
            }

            try {
                const imageUrl = await uploadImageToImgBB(file);
                const chatId = [currentUser.uid, currentChatUser.id].sort().join('_');
                
                await addDoc(collection(db, 'chats', chatId, 'messages'), {
                    imageUrl: imageUrl,
                    senderId: currentUser.uid,
                    receiverId: currentChatUser.id,
                    timestamp: serverTimestamp()
                });

                e.target.value = '';
            } catch (error) {
                alert('Failed to send image: ' + error.message);
            }
        });
    </script>
</body>
</html>
